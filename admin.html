<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>إدارة أهل العود</title><link rel="stylesheet" href="styles.css"><style>.wrap{max-width:900px;margin:30px auto;padding:16px}.panel{padding:22px;margin:18px 0;background:var(--panel);border:1px solid var(--line)}.field{display:grid;gap:6px;margin:13px 0}.field label,.muted{font-size:12px;color:var(--muted)}input,textarea,select{font:inherit;color:var(--text);background:#100f0c;border:1px solid #514432;padding:12px;width:100%}textarea{min-height:90px}.btn{font:inherit;border:0;background:var(--gold);color:#21190e;padding:11px 17px;margin:4px;cursor:pointer}.alt{background:transparent;border:1px solid var(--gold);color:var(--gold)}.danger{background:#702e26;color:white}.hide{display:none!important}.notice{padding:12px;background:#292116;color:#e8d5b4;font-size:12px;white-space:pre-wrap}.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.row img{width:60px;height:60px;object-fit:contain;background:white}.grow{flex:1}@media(max-width:600px){.panel{padding:15px}.row{align-items:flex-start}} </style></head><body><div class="wrap"><header><a class="brand" href="index.html"><span class="seal">ع</span><span><b>إدارة أهل العود</b><small>PRIVATE ADMIN</small></span></a><button id="logout" class="btn alt hide">خروج</button></header><div id="notice" class="notice">التحقق من الإعدادات…</div><section id="login" class="panel hide"><h2>تسجيل الدخول</h2><form id="loginForm"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn">دخول</button><button id="resetPassword" type="button" class="btn alt">استعادة كلمة المرور</button></form></section><section id="dash" class="hide"><div class="panel"><h2>إضافة / تعديل منتج</h2><form id="form"><input id="id" type="hidden"><div class="field"><label>اسم المنتج</label><input id="name" maxlength="160" required></div><div class="field"><label>وصف مختصر</label><textarea id="short"></textarea></div><div class="field"><label>الوصف التفصيلي</label><textarea id="desc"></textarea></div><div class="field"><label>السعر بالدينار (اختياري)</label><input id="price" type="number" min="0" step=".01"></div><div class="field"><label>الحجم (اختياري)</label><input id="size"></div><div class="field"><label>التصنيف (اختياري)</label><input id="category"></div><div class="field"><label>صورة المنتج</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><p class="muted">اختر صورة من الصور أو الملفات على الآيفون. الحد 8MB.</p><img id="preview" class="hide" alt="معاينة" style="max-width:160px;max-height:160px;object-fit:contain;background:white"><button id="removeImage" class="btn alt hide" type="button">إزالة الصورة</button></div><div class="field"><label>حالة المنتج</label><select id="status"><option value="draft">مسودة — مخفي عن الزوار</option><option value="published">منشور</option></select></div><button class="btn">حفظ المنتج</button><button id="clear" class="btn alt" type="button">مسح النموذج</button></form></div><div class="panel"><h2>المنتجات</h2><div id="list"></div></div></section></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
